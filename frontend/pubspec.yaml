name: kodipay
description: A rental management platform for landlords, tenants, and caretakers.
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  pdf: ^3.11.1
  file_picker: ^8.0.0+1
  share_plus: ^9.0.0
  url_launcher: ^6.2.5
  web: ^0.5.1

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
